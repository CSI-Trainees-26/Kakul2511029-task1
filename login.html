<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - College Exploration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <input type="radio" name="login-register" id="login" checked>
        <input type="radio" name="login-register" id="register">
        <div class="login-box">
            <h1>Student Login</h1>

            <p>Login to explore colleges</p>

            <form>
                <label>Email</label>

                <input type="email" placeholder="Enter your email" required>

                <label>Password</label>

                <input type="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>
            <p class="account-text">
                Don't have an account?
                <label for="register">New Register</label>
            </p>
        </div>
        <div class="register-box">

            <h1>New Registration</h1>

            <p>Create your College Exploration account</p>

            <form>
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Email</label>

                <input type="email" placeholder="Enter your email" required>

                <label>Mobile Number</label>

                <input type="tel" placeholder="Enter mobile number" required>

                <label>Password</label>
                <input type="password" placeholder="Create password" required>

                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" required>

                <button type="submit">Register</button>
            </form>

            <p class="account-text">
                Already have an account?
                <label for="login">Login</label>
            </p>
        </div>
    </div>
    </body>
</html>
